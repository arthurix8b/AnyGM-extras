[transforms]

input.probe = buffer probe_source() {
    // Rows are 80 bytes: u64 offset, u64 length, then a 64-byte operation name.
    // A signature only proposes a candidate; the complete reader decides validity.
    uint64_t count = 0; uint64_t overflow = 0;
    // GM7 projects share their header in both representations: offer both.
    if (input_size >= 8 && read32(input, 0) == 1234321 && (read32(input, 4) == 701 || read32(input, 4) == 702)) {
        if (count == 65) { overflow = 1; } else {
            // Candidate: source range plus the zero-padded name 'source.plain'.
            write64(scratch, count * 80, 0);
            write64(scratch, count * 80 + 8, input_size);
            write64(scratch, count * 80 + 16, 8083509858973085555);
            write64(scratch, count * 80 + 24, 1852399980);
            count++;
        }
        if (count == 65) { overflow = 1; } else {
            // Candidate: source range plus the zero-padded name 'source.candidate'.
            write64(scratch, count * 80, 0);
            write64(scratch, count * 80 + 8, input_size);
            write64(scratch, count * 80 + 16, 7146761136480022387);
            write64(scratch, count * 80 + 24, 7310575179021971041);
            write64(scratch, count * 80 + 32, 0);
            count++;
        }
        return scratch_slice(0, count * 80);
    }
    if (input_size < 8 || read8(input, 0) != 'M' || read8(input, 1) != 'Z') return scratch_slice(0, 0);
    if (count == 65) { overflow = 1; } else {
        // Candidate: source range plus the zero-padded name 'source.plain'.
        write64(scratch, count * 80, 0);
        write64(scratch, count * 80 + 8, input_size);
        write64(scratch, count * 80 + 16, 8083509858973085555);
        write64(scratch, count * 80 + 24, 1852399980);
        count++;
    }
    uint64_t wrapped = 0; uint64_t direct = 0;
    // Scan GM5.3/GM8.1 wrappers while retaining ordinary-header alternatives.
    for (uint64_t at = 2; at + 8 <= input_size; at++) {
        uint64_t first = read32(input, at); uint64_t second = read32(input, at + 4);
        if (first == 1234321 && (second == 530 || second == 600 || second == 700 || second == 800 || second == 810)) direct = 1;
        if ((at + 16 <= input_size && first == 0x0012c6a4) || ((first & 0xff00ff00) | (second & 0x00ff00ff)) == 0xf7140067) {
            wrapped = 1;
            if (count == 65) { overflow = 1; } else {
                // Candidate: source range plus the zero-padded name 'source.candidate'.
                write64(scratch, count * 80, at);
                write64(scratch, count * 80 + 8, input_size - at);
                write64(scratch, count * 80 + 16, 7146761136480022387);
                write64(scratch, count * 80 + 24, 7310575179021971041);
                write64(scratch, count * 80 + 32, 0);
                count++;
            }
        } else if (first == 0x4d524f46 && second <= input_size - at - 8) {
            // Keep bounded FORM data when a wrapper-like signature is incidental.
            if (count == 65) { overflow = 1; } else {
                // Candidate: source range plus the zero-padded name 'source.plain'.
                write64(scratch, count * 80, at);
                write64(scratch, count * 80 + 8, second + 8);
                write64(scratch, count * 80 + 16, 8083509858973085555);
                write64(scratch, count * 80 + 24, 1852399980);
                count++;
            }
        }
    }
    // No private wrapper: decline and let ordinary content routing continue.
    if (!wrapped) return scratch_slice(0, 0);
    // Discard the speculative whole-file row unless an ordinary header was found.
    if (!direct) {
        for (uint64_t i = 1; i < count; i++) {
            for (uint64_t j = 0; j < 80; j++) write8(scratch, (i - 1) * 80 + j, read8(scratch, i * 80 + j));
        }
        count--;
    }
    if (overflow || count > 64) reject();
    return scratch_slice(0, count * 80);
}

record = buffer prepare_record() {
    // CLSC descriptor: stream=1, text=2, package=3; revision is the stored layout.
    // This private policy expects encoded records, not arbitrary normalized ones.
    if (metadata_size != 16 || read32(metadata,0) != 0x43534c43 || read32(metadata,12)) {
        return slice(0,input_size);
    }
    uint64_t kind = read32(metadata,4);
    uint64_t revision = read32(metadata,8);
    // GM6: inflated executable envelope -> integrity/settings/resource stream.
    if (kind == 1 && revision == 600) {
        // GM6 inflated envelope: validate its tag, then locate padding, seed and data.
        if (input_size < 44 || read32(input, 0) != 1230600) reject();
        uint64_t seed_offset = 12 + 4 * read32(input, 4);
        uint64_t seed = read32(input, seed_offset);
        uint64_t start = seed_offset + 4 * read32(input, 8) + 12;
        if (start + 40 > input_size) reject();

        // Recreate the seed-dependent byte permutation with 10000 adjacent swaps.
        // scratch[0..255] maps plain to encoded; scratch[256..511] reverses it.
        for (uint64_t i = 0; i < 256; i++) write8(scratch, i, i);
        for (uint64_t i = 1; i <= 10000; i++) {
            uint64_t position = 1 + (i * (6 + seed % 250) + seed / 250) % 254;
            uint64_t saved = read8(scratch, position);
            write8(scratch, position, read8(scratch, position + 1));
            write8(scratch, position + 1, saved);
        }
        for (uint64_t i = 0; i < 256; i++) {
            write8(scratch, 256 + read8(scratch, i), i);
        }

        // Undo byte substitution; writes retain the low eight bits. Input is never modified.
        for (uint64_t offset = start + 1; offset < input_size; offset++) {
            uint64_t decoded = read8(scratch, 256 + read8(input, offset));
            write8(work, offset, decoded);
        }

        // Retained integrity words and the inner revision must agree before parsing.
        if (read32(work, start) != read32(work, start + 4)) reject();
        if (read32(work, start + 8) != 1234321) reject();
        if (read32(work, start + 12) != 600) reject();
        return slice(start, input_size - start);
    }
    // GM7: inflated executable envelope (layout 700, not editor 701/702).
    if (kind == 1 && revision == 700) {
        if (input_size < 13) reject();

        // Two padding counts locate the seed and the first retained byte.
        // That first byte is unchanged; the following bytes use absolute offsets.
        uint64_t seed_offset = 8 + 4 * read32(input, 0);
        uint64_t seed = read32(input, seed_offset);
        uint64_t start = seed_offset + 4 * read32(input, 4) + 4;
        if (start >= input_size) reject();

        // Recreate the seed-dependent byte permutation with 10000 adjacent swaps.
        // scratch[0..255] maps plain to encoded; scratch[256..511] reverses it.
        for (uint64_t i = 0; i < 256; i++) write8(scratch, i, i);
        for (uint64_t i = 1; i <= 10000; i++) {
            uint64_t position = 1 + (i * (6 + seed % 250) + seed / 250) % 254;
            uint64_t saved = read8(scratch, position);
            write8(scratch, position, read8(scratch, position + 1));
            write8(scratch, position + 1, saved);
        }
        for (uint64_t i = 0; i < 256; i++) {
            write8(scratch, 256 + read8(scratch, i), i);
        }

        // Undo substitution and the absolute byte-position addition. Input is never modified.
        for (uint64_t offset = start + 1; offset < input_size; offset++) {
            uint64_t decoded = read8(scratch, 256 + read8(input, offset));
            write8(work, offset, decoded - offset);
        }
        return slice(start, input_size - start);
    }
    // GM8/8.1: inner resource stream, after settings and wrapper strings.
    if (kind == 1 && (revision == 800 || revision == 810)) {
        if (input_size < 270) reject();
        uint64_t table = 8 + 4 * read32(input, 0);
        uint64_t length_offset = table + 4 * read32(input, 4) + 256;
        uint64_t length = read32(input, length_offset);
        uint64_t start = length_offset + 4;
        if (length < 2 || start + length > input_size) reject();

        // Reject repeated table entries before constructing the inverse.
        for (uint64_t i = 0; i < 256; i++) {
            uint64_t value = read8(input, table + i);
            if (read8(scratch, 256 + value)) reject();
            write8(scratch, 256 + value, 1);
            write8(scratch, value, i);
        }
        uint64_t i = length - 1;
        // Walk backwards so the previous encoded byte survives until it is consumed.
        while (i > 0) {
            uint64_t offset = start + i;
            uint64_t value = read8(scratch, read8(work, offset));
            write8(work, offset, value - read8(work, offset - 1) - i);
            i--;
        }
        i = length;
        // Undo the position swaps in reverse order after reversing byte substitution.
        while (i > 0) {
            i--;
            uint64_t distance = read8(input, table + (i & 255));
            uint64_t other = 0;
            if (distance < i) other = i - distance;
            uint64_t saved = read8(work, start + i);
            write8(work, start + i, read8(work, start + other));
            write8(work, start + other, saved);
        }
        return slice(start, length);
    }
    // Legacy compiled script record -> source text; not an editor script.
    if (kind == 2) {
        // Legacy compiled scripts: skip four prefix bytes; use the fixed script seed.
        if (input_size < 4) reject();
        uint64_t seed = 12345;

        // Recreate the seed-dependent byte permutation with 10000 adjacent swaps.
        // scratch[0..255] maps plain to encoded; scratch[256..511] reverses it.
        for (uint64_t i = 0; i < 256; i++) write8(scratch, i, i);
        for (uint64_t i = 1; i <= 10000; i++) {
            uint64_t position = 1 + (i * (6 + seed % 250) + seed / 250) % 254;
            uint64_t saved = read8(scratch, position);
            write8(scratch, position, read8(scratch, position + 1));
            write8(scratch, position + 1, saved);
        }
        for (uint64_t i = 0; i < 256; i++) {
            write8(scratch, 256 + read8(scratch, i), i);
        }

        // Undo byte substitution; writes retain the low eight bits. Input is never modified.
        for (uint64_t offset = 4; offset < input_size; offset++) {
            uint64_t decoded = read8(scratch, 256 + read8(input, offset));
            write8(work, offset, decoded);
        }
        return slice(4, input_size - 4);
    }
    // Adjacent GEX package -> common header plus decoded package data.
    if (kind == 3) {
        if (input_size < 12) reject();
        uint64_t seed = read32(input, 8);

        // Recreate the seed-dependent byte permutation with 10000 adjacent swaps.
        // scratch[0..255] maps plain to encoded; scratch[256..511] reverses it.
        for (uint64_t i = 0; i < 256; i++) write8(scratch, i, i);
        for (uint64_t i = 1; i <= 10000; i++) {
            uint64_t position = 1 + (i * (6 + seed % 250) + seed / 250) % 254;
            uint64_t saved = read8(scratch, position);
            write8(scratch, position, read8(scratch, position + 1));
            write8(scratch, position + 1, saved);
        }
        for (uint64_t i = 0; i < 256; i++) {
            write8(scratch, 256 + read8(scratch, i), i);
        }

        // Undo byte substitution; writes retain the low eight bits. Input is never modified.
        for (uint64_t offset = 12; offset < input_size; offset++) {
            uint64_t decoded = read8(scratch, 256 + read8(input, offset));
            write8(work, offset, decoded);
        }
        // Keep the common 8-byte header, omitting the seed before the decoded payload.
        write64(work,4,read64(input,0));
        return slice(4,input_size-4);
    }
    return slice(0,input_size);
}

source.candidate = buffer prepare_candidate() {
    parameters("_MJD#RWK");
    // GM7 editor projects: revisions 701/702; return a complete normalized project.
    if (input_size >= 8 && read32(input, 0) == 1234321 && (read32(input, 4) == 701 || read32(input, 4) == 702)) {
        if (input_size < 21) reject();

        if (read32(input, 0) != 1234321) reject();
        uint64_t revision = read32(input, 4);
        if (revision != 701 && revision != 702) reject();

        // Two padding counts locate the seed and the first retained byte.
        // That first byte is unchanged; the following bytes use absolute offsets.
        uint64_t seed_offset = 16 + 4 * read32(input, 8);
        uint64_t seed = read32(input, seed_offset);
        uint64_t start = seed_offset + 4 * read32(input, 12) + 4;
        if (start >= input_size) reject();

        // Recreate the seed-dependent byte permutation with 10000 adjacent swaps.
        // scratch[0..255] maps plain to encoded; scratch[256..511] reverses it.
        for (uint64_t i = 0; i < 256; i++) write8(scratch, i, i);
        for (uint64_t i = 1; i <= 10000; i++) {
            uint64_t position = 1 + (i * (6 + seed % 250) + seed / 250) % 254;
            uint64_t saved = read8(scratch, position);
            write8(scratch, position, read8(scratch, position + 1));
            write8(scratch, position + 1, saved);
        }
        for (uint64_t i = 0; i < 256; i++) {
            write8(scratch, 256 + read8(scratch, i), i);
        }

        // Undo substitution and the absolute byte-position addition. Input is never modified.
        for (uint64_t offset = start + 1; offset < input_size; offset++) {
            uint64_t decoded = read8(scratch, 256 + read8(input, offset));
            write8(work, offset, decoded - offset);
        }
        // Preserve the common header before the decoded game id and records.
        start -= 8;
        write64(work, start, read64(input, 0));
        return slice(start, input_size - start);
    }
    // GM5.3 executables: decode the selected wrapper and return its embedded .gmd.
    if (input_size >= 16 && read32(input, 0) == 0x0012c6a4) {
        if (input_size < 16) reject();
        uint64_t seed = read32(input, 4);

        // Recreate the seed-dependent byte permutation with 10000 adjacent swaps.
        // scratch[0..255] maps plain to encoded; scratch[256..511] reverses it.
        for (uint64_t i = 0; i < 256; i++) write8(scratch, i, i);
        for (uint64_t i = 1; i <= 10000; i++) {
            uint64_t position = 1 + (i * seed) % 254;
            uint64_t saved = read8(scratch, position);
            write8(scratch, position, read8(scratch, position + 1));
            write8(scratch, position + 1, saved);
        }
        for (uint64_t i = 0; i < 256; i++) {
            write8(scratch, 256 + read8(scratch, i), i);
        }

        // Undo byte substitution; writes retain the low eight bits. Input is never modified.
        for (uint64_t offset = 8; offset < input_size; offset++) {
            uint64_t decoded = read8(scratch, 256 + read8(input, offset));
            write8(work, offset, decoded);
        }

        // Skip wrapper metadata and its bounded name, preserving the complete project.
        uint64_t name_size = read32(work, 12);
        if (name_size > 1048576) reject();
        uint64_t start = 16 + name_size;
        if (start + 32 > input_size) reject();
        if (read32(work, start) != 1234321 || read32(work, start + 4) != 530) reject();
        return slice(start, input_size - start);
    }
    // GM8.1 executable outer stream: the marker combines alternating byte lanes.
    if (input_size >= 8 && ((read32(input, 0) & 0xff00ff00) | (read32(input, 4) & 0x00ff00ff)) == 0xf7140067) {
        if (input_size < 40 || parameter_size != 8) reject();

        // Reflected CRC-32 table, stored as little-endian words.
        for (uint64_t i = 0; i < 256; i++) {
            uint64_t value = i;
            for (uint64_t bit = 0; bit < 8; bit++) {
                uint64_t low_bit = value & 1;
                value = value >> 1;
                if (low_bit) value ^= 0xedb88320;
            }
            write32(scratch, 4 * i, value);
        }

        // GM8.1 derives its second state word from prefix + decimal key + suffix.
        // CRC consumes UTF-16LE characters; there is no final complement here.
        // Keep the decimal key reversed beyond the CRC table, then read it forwards.
        uint64_t key = read32(input, 8);
        uint64_t digits = 0;
        while (1) {
            write8(scratch, 1024 + digits, '0' + key % 10);
            digits++;
            key /= 10;
            if (key == 0) break;
        }
        uint64_t crc = 0xffffffff;
        for (uint64_t i = 0; i < 4; i++) {
            uint64_t character = read8(parameters, i);
            // One ASCII character followed by its UTF-16LE zero byte.
            crc = (crc >> 8) ^ read32(scratch, 4 * ((crc & 255) ^ character));
            crc = (crc >> 8) ^ read32(scratch, 4 * (crc & 255));
        }
        while (digits > 0) {
            digits--;
            uint64_t character = read8(scratch, 1024 + digits);
            // One ASCII character followed by its UTF-16LE zero byte.
            crc = (crc >> 8) ^ read32(scratch, 4 * ((crc & 255) ^ character));
            crc = (crc >> 8) ^ read32(scratch, 4 * (crc & 255));
        }
        for (uint64_t i = 4; i < 8; i++) {
            uint64_t character = read8(parameters, i);
            // One ASCII character followed by its UTF-16LE zero byte.
            crc = (crc >> 8) ^ read32(scratch, 4 * ((crc & 255) ^ character));
            crc = (crc >> 8) ^ read32(scratch, 4 * (crc & 255));
        }

        uint64_t seed1 = read32(input, 12);
        uint64_t seed2 = crc;
        uint64_t offset = 26 + (seed2 & 255);
        if (offset > input_size) reject();

        // Each complete word uses the next multiply-with-carry mask.
        // Leave the final partial word untouched.
        while (offset + 4 <= input_size) {
            seed1 = (seed1 & 0xffff) * 0x9069 + (seed1 >> 16);
            seed2 = (seed2 & 0xffff) * 0x4650 + (seed2 >> 16);
            uint64_t mask = (seed1 << 16) + (seed2 & 0xffff);
            write32(work, offset, read32(input, offset) ^ mask);
            offset += 4;
        }

        // Reuse the reserved prefix for an ordinary MZ/common header.
        // The settings revision at 32 and the stream at 36 stay unchanged.
        write32(work, 0, 0x00005a4d);
        write32(work, 20, 1234321);
        write32(work, 24, 810);
        write32(work, 28, 0);
        return slice(0, input_size);
    }
    return slice(0, input_size);
}

source.plain = buffer copy_source() {
    return slice(0, input_size);
}
